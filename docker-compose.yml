services:
  aic:
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        WWWGROUP: '${WWWGROUP}'
    image: aic-phpfpm/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
      - '9003:9003'
    expose:
      - "80"
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      SUPERVISOR_PHP_USER: sail
      DB_CONNECTION: '${WEB_DB_CONNECTION}'
      DB_HOST: '${WEB_DB_HOST}'
      DB_PORT: '${WEB_DB_PORT}'
      DB_DATABASE: '${WEB_DB_DATABASE}'
      DB_USERNAME: '${WEB_DB_USERNAME}'
      DB_PASSWORD: '${WEB_DB_PASSWORD}'
    volumes:
      - '~/Code/aic:/var/www/aic/html'
    networks:
      - sail
    depends_on:
      - mysql
      - pgsql
      - redis
      - elasticsearch

  utils:
    build:
      context: .
      dockerfile: Dockerfile.utils
      args:
        WWWGROUP: '${WWWGROUP}'
    image: aic-utils/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER}'
      DB_CONNECTION: '${WEB_DB_CONNECTION}'
      DB_HOST: '${WEB_DB_HOST}'
      DB_PORT: '${WEB_DB_PORT}'
      DB_DATABASE: '${WEB_DB_DATABASE}'
      DB_USERNAME: '${WEB_DB_USERNAME}'
      DB_PASSWORD: '${WEB_DB_PASSWORD}'
    volumes:
      - '~/Code/utils:/var/utils/utils'
      - '~/docker/after_files:/var/utils/after_files'  # Mount credentials
    networks:
      - sail
    depends_on:
      - mysql
      - pgsql
      - redis
      - elasticsearch
    # Override the default command to keep container running
    command: tail -f /dev/null

  data-aggregator:
    build:
      context: .
      dockerfile: Dockerfile.data-aggregator
      args:
        WWWGROUP: '${WWWGROUP}'
    image: aic-data-aggregator/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '9004:9004'
    expose:
      - "9000"
      - "80"
    environment:
      WWWUSER: '${WWWUSER}'
      DB_CONNECTION: '${DA_DB_CONNECTION}'
      DB_HOST: '${DA_DB_HOST}'
      DB_PORT: '${DA_DB_PORT}'
      DB_DATABASE: '${DA_DB_DATABASE}'
      DB_USERNAME: '${DA_DB_USERNAME}'
      DB_PASSWORD: '${DA_DB_PASSWORD}'
    volumes:
      - '~/Code/data-aggregator:/var/www/data-aggregator/html'
      - '~/Code/utils/dumps:/var/utils/dumps'
    networks:
      - sail
    depends_on:
      - mysql
      - redis
      - elasticsearch

  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DA_DB_DATABASE}'
      MYSQL_USER: '${DA_DB_USERNAME}'
      MYSQL_PASSWORD: '${DA_DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS}'
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - '~/Code/aic/vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
      - './mysql/init-databases.sql:/docker-entrypoint-initdb.d/20-init-databases.sql'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DA_DB_PASSWORD}'
      retries: 3
      timeout: 5s

  pgsql:
    image: 'pgvector/pgvector:pg16-trixie'
    ports:
      - '54320:5432'
    environment:
      PGPASSWORD: '${WEB_DB_PASSWORD:-secret}'
      POSTGRES_DB: '${WEB_DB_DATABASE}'
      POSTGRES_USER: '${WEB_DB_USERNAME}'
      POSTGRES_PASSWORD: '${WEB_DB_PASSWORD:-secret}'
    volumes:
      - 'sail-pgsql:/var/lib/postgresql/data'
      - '~/Code/aic/vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
      - './pgsql/init-databases.sh:/docker-entrypoint-initdb.d/20-init-databases.sh'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${WEB_DB_DATABASE}'
        - '-U'
        - '${WEB_DB_USERNAME}'
      retries: 3
      timeout: 5s

  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

  elasticsearch:
    image: 'elasticsearch:8.17.10'
    ports:
      - '9200:9200'
      - '9300:9300'
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "xpack.security.enabled=false"
      - "xpack.security.enrollment.enabled=false"
      - "network.host=0.0.0.0"
      - "http.host=0.0.0.0"
      - "transport.host=0.0.0.0"
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "bootstrap.memory_lock=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - 'sail-elasticsearch:/usr/share/elasticsearch/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s || exit 1"
      interval: 30s
      retries: 5
      timeout: 30s
      start_period: 60s

  nginx:
    image: 'nginx:alpine'
    ports:
      - '80:80'
    volumes:
      - './nginx/nginx.conf:/etc/nginx/nginx.conf'
      - '~/Code/aic:/var/www/aic/html'
      - '~/Code/data-aggregator:/var/www/data-aggregator/html'
    networks:
      - sail
    depends_on:
      aic:
        condition: service_started
      data-aggregator:
        condition: service_started
    restart: unless-stopped

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
  sail-elasticsearch:
    driver: local