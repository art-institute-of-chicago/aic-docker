services:
  aic:
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        WWWGROUP: '${WWWGROUP}'
    image: aic-phpfpm/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
      - '9003:9003'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      SUPERVISOR_PHP_USER: sail
      DB_CONNECTION: '${DB_CONNECTION}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - '~/Code/aic:/var/www/html'
    networks:
      - sail
    depends_on:
      - mysql
      - pgsql
      - redis
      - elasticsearch

  utils:
    build:
      context: .
      dockerfile: Dockerfile.utils
      args:
        WWWGROUP: '${WWWGROUP}'
    image: aic-utils/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      WWWUSER: '${WWWUSER}'
      DB_CONNECTION: '${DB_CONNECTION}'
      DB_HOST: '${DB_HOST}'
      DB_PORT: '${DB_PORT}'
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - '~/Code/utils:/var/utils/utils'
      - '~/docker/after_files:/var/utils/after_files'  # Mount credentials
    networks:
      - sail
    depends_on:
      - mysql
      - pgsql
      - redis
      - elasticsearch
    # Override the default command to keep container running
    command: tail -f /dev/null

  mysql:
    image: 'mysql/mysql-server:8.0'
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS}'
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - '~/Code/aic/vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
      - './mysql/init-databases.sql:/docker-entrypoint-initdb.d/20-init-databases.sql'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - '-p${DB_PASSWORD}'
      retries: 3
      timeout: 5s

  pgsql:
    image: 'postgres:17'
    ports:
      - '54320:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-secret}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'sail-pgsql:/var/lib/postgresql/data'
      - '~/Code/aic/vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
      - './pgsql/init-databases.sql:/docker-entrypoint-initdb.d/20-init-databases.sql'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE}'
        - '-U'
        - '${DB_USERNAME}'
      retries: 3
      timeout: 5s

  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'sail-redis:/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

  elasticsearch:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:7.10.2'
    ports:
      - '9200:9200'
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - 'sail-elasticsearch:/usr/share/elasticsearch/data'
    networks:
      - sail
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://localhost:9200 || exit 1"
      retries: 3
      timeout: 10s

  nginx:
    image: 'nginx:alpine'
    ports:
      - '8000:80'
    volumes:
      - './nginx/nginx.conf:/etc/nginx/nginx.conf'
      - '~/Code/aic:/var/www/html'
    networks:
      - sail
    depends_on:
      - aic
    restart: unless-stopped

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
  sail-pgsql:
    driver: local
  sail-redis:
    driver: local
  sail-elasticsearch:
    driver: local