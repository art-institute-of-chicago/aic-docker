events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 0;

    # Logging for debugging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Resolve upstream hostnames per-request (via Docker's embedded DNS) instead of at
    # config-load time, so nginx still starts even when a profile-gated service isn't running.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;
        server_name api-dev.artic.edu;
        root /var/www/data-aggregator/public;
        index index.php index.html;

        # Handle static assets first
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Handle PHP files
        location ~ \.php$ {
            try_files $uri =404;
            set $upstream_data_aggregator data-aggregator:9000;
            fastcgi_pass $upstream_data_aggregator;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_read_timeout 300;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }
    }

    server {
        listen 80;
        server_name localhost www-dev.artic.edu admin.www-dev.artic.edu kiosk.www-dev.artic.edu;
        root /var/www/website/public;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Handles files from /storage/ path with CORS headers
        location ~* ^/storage/.*\.(glb|gltf|bin|png|jpg|jpeg|gif|ico|svg|webp|pdf|json)$ {
            # Set CORS origin based on the requesting domain
            set $cors_origin "";

            # Allow all subdomains of artic.edu
            if ($http_origin ~* ^https?://.*\.artic\.edu$) {
                set $cors_origin $http_origin;
            }

            # Also allow the main domain
            if ($http_origin ~* ^https?://artic\.edu$) {
                set $cors_origin $http_origin;
            }

            # Add CORS headers
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Type, Content-Disposition" always;
            add_header Access-Control-Max-Age 3600 always;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type, Authorization" always;
                add_header Access-Control-Max-Age 3600 always;
                add_header Content-Type "text/plain charset=UTF-8";
                add_header Content-Length 0;
                return 204;
            }

            # Try to serve the file, fallback to Laravel if not found
            try_files $uri /index.php?$query_string;
        }

        location ~* \.(css|js|woff|woff2|ttf|eot)$ {
            try_files $uri /index.php?$query_string;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            try_files $uri /index.php?$query_string;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~ \.php$ {
            set $upstream_aic website:9000;
            fastcgi_pass $upstream_aic;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            fastcgi_param REQUEST_SCHEME $scheme;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            fastcgi_read_timeout 300;
        }
    }

